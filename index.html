<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafletJS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    //initialize map
    <script>var map = L.map('map').setView([-7.8013, 110.3647], 13);

        // Tile Layer Base Map
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        var rupabumiindonesia = L.tileLayer('https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Badan Informasi Geospasial'
        });
        var OpenTopoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
        });

        // Menambahkan basemap ke dalam peta
        Esri_WorldImagery.addTo(map);

        // Marker
        var marker = L.marker([-7.8013, 110.3647]);
        var marker2 = L.marker([-7.9748, 110.3181]);

        // Menambahkan marker ke dalam peta
        marker.addTo(map);
        marker2.addTo(map);

        // Popup
        marker.bindPopup(`
    <b>Daerah Istimewa Yogyakarta</b>
    <p>
        Daerah Istimewa Yogyakarta[a] (disingkat DI Yogyakarta, DIY, Yogya, atau Jogja)
        adalah daerah Istimewa setingkat provinsi di Indonesia yang merupakan peleburan
        dari Negara Kesultanan Yogyakarta dan Negara Kadipaten Paku Alaman dengan ibu kota
        di Kota Yogyakarta.
    </p>
    <p>
        Daerah Istimewa Yogyakarta terletak di bagian selatan Pulau Jawa, dan berbatasan
        dengan Provinsi Jawa Tengah dan Samudra Hindia. Daerah Istimewa yang memiliki luas
        3.185,80 km² ini terdiri atas satu kota, dan empat kabupaten, yang terbagi lagi
        menjadi 78 kapanewon/kemantren, dan 438 kalurahan/kelurahan.
    </p>
    <p>
        Menurut sensus penduduk 2010 memiliki populasi 3.452.390 jiwa dengan proporsi
        1.705.404 laki-laki, dan 1.746.986 perempuan, serta memiliki kepadatan penduduk
        sebesar 1.084 jiwa per km².[7][8] Dan pada tahun 2025, jumlah penduduk provinsi
        ini sebanyak 3.762.541 jiwa.[1][9][10]
    </p>
`);
        marker2.bindPopup(`
    <b>Kecamatan Kretek</b>
    <p>
        Kretek (bahasa Jawa: Krètèk) adalah sebuah kapanéwon di Kabupaten Bantul, Provinsi Daerah Istimewa Yogyakarta,Indonesia.
    </p>
`);

        // Tooltip
        marker.bindTooltip("Yogyakarta");
        marker.openTooltip();
        marker2.bindTooltip("Kecamatan Kretek");
        marker2.openTooltip();

        // Circle
        var circle = L.circle([-7.7700252, 110.3806291], {
            color: "pink", // warna garis
            opacity: 1, // opacity garis
            fillColor: "#f09", // warna fill
            fillOpacity: 0.5, // opacity fill
            radius: 1000, // radius dalam meter
        });

        // Menambahkan circle ke dalam peta
        circle.addTo(map);

        //PopUp
        circle.bindPopup(`
        <b>Hallo</b><br>Ini adalah pop up circle radius`);

        //Tooltip
        circle.bindTooltip("Ini adalah Circle", { sticky: true });
        circle.openTooltip();

        // Polyline
        var vertexPolyline = [
            [-7.7748304, 110.3745082],
            [-7.9274193, 110.3505668],
            [-7.9839842, 110.3015419],
        ];
        var polyline = L.polyline(vertexPolyline, {
            color: "red", // warna garis
            weight: 5, // ketebalan garis
            opacity: 1, // opacity garis
        });

        // Menambahkan polyline ke dalam peta
        polyline.addTo(map);

        //Pop Up Polyline
        polyline.bindPopup("<b>Hallo</b><br>Ini adalah pop up polyline",);
        polyline.openPopup();

        // Tooltip
        polyline.bindTooltip("Ini adalah tooltip polyline", { sticky: true });
        polyline.openTooltip();

        // Polygon
        var vertexPolygon = [
            [-7.8208535, 110.4347360],
            [-7.8205135, 110.5085268],
            [-7.8905544, 110.5085268],
            [-7.8922542, 110.4313039],
            [-7.8208535, 110.4347360]
        ];
        var polygon = L.polygon(vertexPolygon, {
            color: "pink", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
            fillColor: "#f09", // warna fill
            fillOpacity: 0.5, // opacity fill
        });

        // Menambahkan polygon ke dalam peta
        polygon.addTo(map);

        // Popup
        polygon.bindPopup("<b>Hallo</b><br>Ini adalah popup polygon");
        polygon.openPopup();

        // Tooltip
        polygon.bindTooltip("Ini adalah tooltip polygon", { sticky: true });
        polygon.openTooltip();

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
            "OpenTopoMap": OpenTopoMap,
        };

        var overlayMaps = {
            "Yogyakarta": marker,
            "Kecamatan Kretek": marker2,
            "Circle": circle,
            "Line": polyline,
            "Polygon": polygon,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });
        controllayer.addTo(map);

        // Scale
        var scale = L.control.scale();
        scale.addTo(map);

        // Geolocation
        map.locate({
            setView: true,
            maxZoom: 16,
        });

        // Fungsi untuk menampilkan lokasi
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            // Menampilkan marker pada lokasi 
            L.marker(e.latlng).addTo(map).bindPopup("Anda berada dalam radius " + radius + " meter dari titik ini").openPopup();

            // Menampilkan circle pada lokasi
            L.circle(e.latlng, radius).addTo(map);
        }

        map.on("locationfound", onLocationFound);

        // Fungsi untuk menampilkan pesan error
        function onLocationError(e) {
            alert(e.message);
        }

        map.on("locationerror", onLocationError);
    </script>
</body>

</html>
